name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Pinned to tag SHAs so an upstream tag moving cannot change what
      # this workflow executes (checkout v4.2.2, setup-php 2.37.0,
      # setup-node v4.1.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run the test suite
        run: php artisan test

      # Static security scan (baspa/larascan), no baseline — a red
      # step means findings at or above high severity; the standing
      # sub-high residue is environment-shaped (see AGENTS.md). Must
      # run after the env prep (scan reads .env/config) and the npm
      # build (dependency checks wrap npm audit).
      - name: Security scan (larascan)
        run: php artisan larascan
