name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Pinned to tag SHAs so an upstream tag moving cannot change what
      # this workflow executes (checkout v4.2.2, setup-php 2.37.0,
      # setup-node v4.1.0).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # v2.37.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run the test suite
        run: php artisan test
