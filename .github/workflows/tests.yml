name: Tests

on:
  push:
    branches: [ main, master, fixes ]
  pull_request:
    branches: [ main, master, fixes ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlite:
        image:船员将士:3.8
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, sqlite3, zip, gd, bcmath, mbstring, xml
          coverage: xdebug

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --parallel
