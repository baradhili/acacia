name: Laravel Security Review

on:
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    # Prevent running on forks without secrets, or if it's a draft PR (optional)
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Laravel 13 requires PHP 8.2+
          extensions: mbstring, xml, curl, dom
          coverage: none
          tools: composer:v2

      - name: Setup Laravel Environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-scripts
          php artisan key:generate

      # --------------------------------------------------------
      # TIER 1: Dependency Vulnerabilities (Fails on CVEs)
      # --------------------------------------------------------
      - name: Composer Dependency Audit
        run: composer audit --no-interaction

      # --------------------------------------------------------
      # TIER 2: SAST Code Scanning (Fails on bad code patterns)
      # --------------------------------------------------------
      - name: Run Semgrep (PHP & Laravel Rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/php p/laravel" # Official PHP and Laravel rule sets
          # Semgrep automatically fails the CI step if it finds errors

      # --------------------------------------------------------
      # TIER 3: Laravel-Specific Security (Fails on misconfigs)
      # --------------------------------------------------------
      - name: Run Enlightn Security Analysis
        run: php artisan enlightn:check --no-interaction