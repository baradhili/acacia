<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" >
    <defs>
        <!-- Gradient spanning across the canopy -->
        <linearGradient id="acaciaCanopy" x1="2.5" y1="0" x2="19.5" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10b981" />   <!-- Emerald Green -->
            <stop offset="100%" stop-color="#f59e0b" /> <!-- Golden Amber -->
        </linearGradient>
    </defs>
    
    <!-- Trunk and Branches -->
    <path d="M12 23 V15 M12 15 L8 9 M12 15 L16 9 M12 15 V9" 
          stroke="#334155" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <!-- Canopy / Nodes -->
    <circle cx="7" cy="6" r="4" fill="url(#acaciaCanopy)" />
    <circle cx="17" cy="6" r="4" fill="url(#acaciaCanopy)" />
    <circle cx="12" cy="4.5" r="4.5" fill="url(#acaciaCanopy)" />
</svg>